<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Admin | Snow Hill Missionary Baptist Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%232D2667'/><rect x='47' y='18' width='6' height='64' rx='3' fill='%23C9A84C'/><rect x='28' y='32' width='44' height='6' rx='3' fill='%23C9A84C'/></svg>">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <a class="brand" href="../" title="Open the public site">
            <span class="brand-cross" aria-hidden="true"></span>
            <span class="brand-text">Snow Hill MBC <span class="brand-sub">Site Admin</span></span>
        </a>
        <div class="who" id="who" hidden>
            <span class="who-email" id="who-email"></span>
            <span class="chip" id="who-role"></span>
        </div>
    </header>

    <div class="devbar" id="devbar" hidden>
        <strong>Local preview.</strong>
        <label for="dev-identity">Viewing as</label>
        <select id="dev-identity"></select>
    </div>

    <div class="shell" id="shell" hidden>
        <nav class="sections" aria-label="Site sections">
            <button type="button" class="sections-toggle" id="sections-toggle" aria-expanded="false" aria-controls="sections-list">
                <span class="sections-toggle-label">Section</span>
                <span class="sections-toggle-current" id="sections-current"></span>
                <span class="sections-toggle-caret" aria-hidden="true"></span>
            </button>
            <ul class="sections-list" id="sections-list"></ul>
        </nav>

        <main class="main" id="main" tabindex="-1"></main>
    </div>

    <div class="gate" id="gate" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="admin.js"></script>
</body>
</html>
