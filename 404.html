<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found | Snow Hill Missionary Baptist Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%232D2667'/><rect x='47' y='18' width='6' height='64' rx='3' fill='%23C9A84C'/><rect x='28' y='32' width='44' height='6' rx='3' fill='%23C9A84C'/></svg>">
    <style>
        :root { --brick-deep: #2D2667; --brick: #3A35A0; --cream: #F0F2FF; --gold: #C9A84C; --gold-light: #E0C47A; --text-body: #2A2D3D; --warm-gray: #565E6B; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: 'Lora', Georgia, serif; color: var(--text-body); background: var(--cream); display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--brick-deep); padding: 1.1rem 1.5rem; text-align: center; }
        header a { font-family: 'Playfair Display', Georgia, serif; color: #fff; text-decoration: none; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
        .card { max-width: 34rem; text-align: center; }
        .cross { width: 44px; height: 64px; margin: 0 auto 1.5rem; position: relative; }
        .cross::before { content: ""; position: absolute; left: 19px; top: 0; width: 6px; height: 64px; border-radius: 3px; background: var(--gold); }
        .cross::after { content: ""; position: absolute; left: 0; top: 14px; width: 44px; height: 6px; border-radius: 3px; background: var(--gold); }
        .code { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; color: var(--brick); font-size: 1.25rem; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
        h1 { font-family: 'Playfair Display', Georgia, serif; color: var(--brick-deep); font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.2; margin-bottom: 1rem; }
        p { color: var(--warm-gray); font-size: 1.05rem; line-height: 1.7; margin-bottom: 2rem; }
        .btn { display: inline-block; background: var(--brick-deep); color: #fff; text-decoration: none; padding: 0.85rem 2rem; border-radius: 4px; font-weight: 500; border-bottom: 3px solid var(--gold); }
        .btn:hover, .btn:focus { background: var(--brick); }
        footer { text-align: center; padding: 1.25rem; font-size: 0.85rem; color: var(--warm-gray); }
    </style>
</head>
<body>
    <header><a href="/">Snow Hill Missionary Baptist Church</a></header>
    <main>
        <div class="card">
            <div class="cross" aria-hidden="true"></div>
            <div class="code">404</div>
            <h1>We couldn't find that page</h1>
            <p>The page you were looking for isn't here. Everything about our church, services, and events is on our home page.</p>
            <a class="btn" href="/">Return Home</a>

    </main>
    <footer>Snow Hill Missionary Baptist Church, Roseboro, NC</footer>
